<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ecomm — Store</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <!-- Link to the external CSS file -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<nav>
  <a class="nav-brand" href="#">Écomm</a>
  <div class="nav-links">
    <button class="nav-btn active" onclick="showPage('products')">Products</button>
    <button class="nav-btn" onclick="showPage('orders')">Orders</button>
    <button class="nav-btn" onclick="showPage('admin')">Admin</button>
    <button class="cart-btn" onclick="openCart()">
      🛒 Cart
      <span class="cart-count" id="cart-count">0</span>
    </button>
  </div>
</nav>

<!-- CART DRAWER -->
<div class="cart-overlay" id="cart-overlay" onclick="closeCartOnOverlay(event)">
  <div class="cart-drawer">
    <div class="cart-head">
      <h2>Your Cart</h2>
      <button class="close-btn" onclick="closeCart()">✕</button>
    </div>
    <div class="cart-items" id="cart-items-list"></div>
    <div class="cart-foot" id="cart-foot">
      <div class="cart-total"><span>Total</span><span id="cart-total-val">₹0</span></div>
      <button class="checkout-btn" onclick="checkout()">Proceed to Checkout →</button>
    </div>
  </div>
</div>

<!-- PRODUCT MODAL -->
<div class="modal-overlay" id="product-modal" onclick="closeModalOnOverlay(event)">
  <div class="modal" id="modal-content">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="product-img-large" id="modal-img"></div>
    <div class="product-cat" id="modal-cat"></div>
    <h2 id="modal-name"></h2>
    <div class="modal-price" id="modal-price"></div>
    <p class="modal-desc" id="modal-desc"></p>
    <button class="modal-add" id="modal-add-btn">Add to Cart</button>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<main>
  <!-- PRODUCTS PAGE -->
  <div id="page-products">
    <div class="hero">
      <div class="hero-tag">New Arrivals</div>
      <h1>Curated for You,<br/>Crafted to Last</h1>
      <p>Discover our latest collection. Quality products, delivered fast from our Spring-powered store.</p>
      <button class="hero-cta" onclick="loadProducts()">Browse Collection →</button>
    </div>

    <div class="section-header">
      <h2 class="section-title">Products</h2>
      <span class="section-link" onclick="loadProducts()">↻ Refresh</span>
    </div>

    <div class="search-wrap">
      <input class="search-input" id="search-input" type="text" placeholder="Search products…" oninput="filterProducts()" />
      <button class="search-btn" onclick="filterProducts()">Search</button>
    </div>

    <div class="filter-bar" id="filter-bar">
      <button class="filter-chip active" onclick="setFilter('all', this)">All</button>
    </div>

    <div id="products-container" class="product-grid"></div>
  </div>

  <!-- ORDERS PAGE -->
  <div id="page-orders" style="display:none">
    <div class="section-header">
      <h2 class="section-title">Your Orders</h2>
      <span class="section-link" onclick="loadOrders()">↻ Refresh</span>
    </div>
    <div id="orders-container"></div>
  </div>

  <!-- ADMIN PAGE -->
  <div id="page-admin" style="display:none">
    <div class="section-header">
      <h2 class="section-title">Admin — Add Product</h2>
    </div>
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.5rem 2rem;max-width:520px">
      <div style="display:grid;gap:1rem;">
        <div>
          <label style="font-size:0.8rem;font-weight:500;display:block;margin-bottom:4px;color:var(--muted)">PRODUCT NAME</label>
          <input class="search-input" id="new-name" placeholder="e.g. Wireless Headphones" style="width:100%"/>
        </div>
        <div>
          <label style="font-size:0.8rem;font-weight:500;display:block;margin-bottom:4px;color:var(--muted)">CATEGORY</label>
          <input class="search-input" id="new-cat" placeholder="e.g. Electronics" style="width:100%"/>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
          <div>
            <label style="font-size:0.8rem;font-weight:500;display:block;margin-bottom:4px;color:var(--muted)">PRICE (₹)</label>
            <input class="search-input" id="new-price" type="number" placeholder="999" style="width:100%"/>
          </div>
          <div>
            <label style="font-size:0.8rem;font-weight:500;display:block;margin-bottom:4px;color:var(--muted)">STOCK</label>
            <input class="search-input" id="new-stock" type="number" placeholder="50" style="width:100%"/>
          </div>
        </div>
        <div>
          <label style="font-size:0.8rem;font-weight:500;display:block;margin-bottom:4px;color:var(--muted)">DESCRIPTION</label>
          <textarea class="search-input" id="new-desc" rows="3" placeholder="Short description…" style="width:100%;resize:vertical"></textarea>
        </div>
        <button class="checkout-btn" onclick="addProduct()">Add Product →</button>
      </div>
    </div>
  </div>
</main>

<footer>
  Écomm · Powered by Spring Boot & MySQL
</footer>

<!-- Link to the external JS file -->
<script src="script.js"></script>
</body>
</html>
